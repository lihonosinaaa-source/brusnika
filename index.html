<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>График смен</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, sans-serif;
    }

    body {
        min-height: 100vh;
        background-color: #f7e9e9;
        background-image: url('https://e.radikal.host/2026/10/02/IMG_4283.png');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        background-repeat: no-repeat;
        padding: 30px 15px;
        color: #5a2a2a;
    }

    /* ===== Лёгкое затемнение фона (фото хорошо видно) ===== */
    body::before {
        content: '';
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(255, 235, 235, 0.18);
        backdrop-filter: blur(1px);
        -webkit-backdrop-filter: blur(1px);
        z-index: -1;
    }

    h1 {
        text-align: center;
        font-weight: 300;
        letter-spacing: 2px;
        margin-bottom: 22px;
        color: #7a2f2f;
        text-shadow: 0 2px 10px rgba(255,255,255,0.8);
        font-size: 28px;
    }

    .main-container {
        max-width: 720px;
        margin: 0 auto;
    }

    /* ===== Кнопки ===== */
    .btn {
        background: rgba(255, 255, 255, 0.55);
        border: 1px solid rgba(200, 120, 120, 0.5);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        color: #7a2f2f;
        padding: 12px 22px;
        border-radius: 14px;
        cursor: pointer;
        font-size: 15px;
        font-weight: 600;
        transition: all 0.25s ease;
        box-shadow: 0 4px 20px rgba(200, 120, 120, 0.25);
        display: inline-flex;
        align-items: center;
        gap: 8px;
    }

    .btn:hover {
        background: rgba(255, 255, 255, 0.85);
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(200, 120, 120, 0.4);
    }

    .btn:active { transform: translateY(0); }

    /* ===== Выбор месяца ===== */
    .month-selector {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        background: rgba(255, 255, 255, 0.5);
        border: 1px solid rgba(200, 120, 120, 0.4);
        backdrop-filter: blur(14px);
        border-radius: 18px;
        padding: 12px 18px;
        margin: 0 auto 20px;
        max-width: 420px;
        box-shadow: 0 6px 24px rgba(200, 120, 120, 0.2);
    }

    .month-arrow {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.7);
        border: 1px solid rgba(200, 120, 120, 0.4);
        color: #7a2f2f;
        cursor: pointer;
        font-size: 20px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: 0.2s;
    }

    .month-arrow:hover {
        background: #fff;
        transform: scale(1.08);
    }

    .month-name {
        flex: 1;
        text-align: center;
        font-size: 20px;
        font-weight: 700;
        color: #7a2f2f;
        letter-spacing: 1px;
        user-select: none;
    }

    .btn-create-week {
        display: block;
        margin: 0 auto 25px;
        font-size: 17px;
        padding: 14px 30px;
    }

    .hidden { display: none !important; }

    /* ===== Неделя ===== */
    .week-block {
        background: rgba(255, 255, 255, 0.5);
        border: 1px solid rgba(200, 120, 120, 0.4);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-radius: 22px;
        padding: 18px;
        margin-bottom: 22px;
        box-shadow: 0 8px 32px rgba(200, 120, 120, 0.25);
    }

    .week-block.closed {
        border-color: rgba(120, 200, 140, 0.6);
        box-shadow: 0 8px 32px rgba(120, 200, 140, 0.25);
    }

    .week-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
        padding-bottom: 12px;
        border-bottom: 1px solid rgba(200, 120, 120, 0.25);
        flex-wrap: wrap;
        gap: 10px;
    }

    .week-title {
        font-size: 18px;
        font-weight: 700;
        color: #7a2f2f;
    }

    .week-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    .btn-small {
        padding: 7px 14px;
        font-size: 13px;
        border-radius: 10px;
    }

    .btn-danger {
        background: rgba(255, 180, 180, 0.55);
        border-color: rgba(230, 120, 120, 0.6);
        color: #8a2a2a;
    }

    .btn-danger:hover { background: rgba(255, 160, 160, 0.85); }

    .btn-finish {
        background: rgba(255, 210, 210, 0.6);
        border-color: rgba(220, 140, 140, 0.6);
    }

    .btn-finish:hover { background: rgba(255, 190, 190, 0.9); }

    .btn-finish.finished {
        background: rgba(180, 240, 200, 0.7);
        border-color: rgba(120, 220, 150, 0.7);
        color: #1e6b3a;
    }

    /* ===== Плитка добавления дня ===== */
    .add-day-tile {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: rgba(255, 200, 200, 0.5);
        border: 2px dashed rgba(200, 100, 100, 0.6);
        cursor: pointer;
        font-size: 30px;
        color: #8a2a2a;
        transition: all 0.25s ease;
        backdrop-filter: blur(10px);
    }

    .add-day-tile:hover {
        background: rgba(255, 180, 180, 0.75);
        transform: scale(1.07) rotate(90deg);
        border-color: #8a2a2a;
    }

    .days-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: flex-start;
    }

    /* ===== Карточка дня ===== */
    .day-card {
        width: 100%;
        background: rgba(255, 255, 255, 0.55);
        border: 1px solid rgba(200, 120, 120, 0.35);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border-radius: 18px;
        padding: 14px;
        box-shadow: 0 6px 24px rgba(200, 120, 120, 0.2);
        animation: fadeIn 0.3s ease;
    }

    .day-card.collapsed {
        padding: 10px 14px;
    }

    .day-card.collapsed .day-body { display: none; }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .day-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
    }

    .day-card:not(.collapsed) .day-top {
        margin-bottom: 10px;
    }

    .day-number-input {
        background: rgba(255, 255, 255, 0.75);
        border: 1px solid rgba(200, 120, 120, 0.4);
        border-radius: 9px;
        color: #5a2a2a;
        padding: 6px 10px;
        font-size: 14px;
        width: 95px;
        outline: none;
        transition: 0.2s;
    }

    .day-number-input::placeholder { color: rgba(140, 80, 80, 0.55); }

    .day-number-input:focus {
        border-color: #d68a8a;
        background: #fff;
        box-shadow: 0 0 0 3px rgba(220, 140, 140, 0.25);
    }

    .day-summary {
        flex: 1;
        font-size: 13px;
        color: #8a5a5a;
        font-weight: 600;
        padding-left: 4px;
    }

    .day-top-btns { display: flex; gap: 6px; }

    .icon-btn {
        background: rgba(255, 255, 255, 0.7);
        border: 1px solid rgba(200, 120, 120, 0.4);
        color: #7a2f2f;
        width: 32px;
        height: 32px;
        border-radius: 9px;
        cursor: pointer;
        font-size: 15px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: 0.2s;
    }

    .icon-btn:hover { background: #fff; transform: scale(1.05); }

    /* ===== Строка часов ===== */
    .shift-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 0;
    }

    .hours-input {
        width: 90px;
        background: rgba(255, 255, 255, 0.75);
        border: 1px solid rgba(200, 120, 120, 0.4);
        border-radius: 9px;
        color: #5a2a2a;
        padding: 8px 10px;
        font-size: 15px;
        text-align: center;
        outline: none;
        transition: 0.2s;
        -moz-appearance: textfield;
        font-weight: 600;
    }

    .hours-input::-webkit-outer-spin-button,
    .hours-input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
    }

    .hours-input:focus {
        border-color: #d68a8a;
        background: #fff;
        box-shadow: 0 0 0 3px rgba(220, 140, 140, 0.25);
    }

    .hours-word {
        font-size: 14px;
        color: #8a5a5a;
        font-weight: 600;
        flex-shrink: 0;
    }

    .money {
        margin-left: auto;
        font-weight: 700;
        color: #b05050;
        font-size: 16px;
        white-space: nowrap;
    }

    /* ===== Итого дня ===== */
    .total-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 6px;
        padding-top: 12px;
        border-top: 1px solid rgba(200, 120, 120, 0.3);
        gap: 8px;
        flex-wrap: wrap;
    }

    .total-label {
        font-size: 14px;
        font-weight: 700;
        color: #7a2f2f;
    }

    .total-block {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-left: auto;
    }

    .total-value {
        font-size: 15px;
        font-weight: 700;
        color: #7a2f2f;
        background: rgba(255, 210, 210, 0.7);
        padding: 5px 14px;
        border-radius: 10px;
        border: 1px solid rgba(220, 140, 140, 0.5);
        white-space: nowrap;
    }

    .total-money {
        font-size: 15px;
        font-weight: 700;
        color: #1e6b3a;
        background: rgba(200, 245, 215, 0.7);
        padding: 5px 14px;
        border-radius: 10px;
        border: 1px solid rgba(120, 220, 150, 0.6);
        white-space: nowrap;
    }

    .paid-btn {
        font-size: 14px;
        font-weight: 700;
        color: #fff;
        background: rgba(180, 130, 130, 0.75);
        padding: 6px 14px;
        border-radius: 10px;
        border: 1px solid rgba(150, 100, 100, 0.6);
        cursor: pointer;
        transition: all 0.25s ease;
        white-space: nowrap;
    }

    .paid-btn:hover {
        transform: translateY(-1px);
        filter: brightness(1.08);
    }

    .paid-btn.status-match {
        background: rgba(80, 210, 130, 0.85);
        border-color: rgba(60, 190, 110, 0.95);
        box-shadow: 0 0 14px rgba(80, 210, 130, 0.55);
    }

    .paid-btn.status-less {
        background: rgba(240, 90, 90, 0.85);
        border-color: rgba(220, 70, 70, 0.95);
        box-shadow: 0 0 14px rgba(240, 90, 90, 0.55);
    }

    .paid-btn.status-more {
        background: rgba(180, 120, 240, 0.85);
        border-color: rgba(160, 100, 220, 0.95);
        box-shadow: 0 0 14px rgba(180, 120, 240, 0.55);
    }

    /* ===== Примечания ===== */
    .notes-block {
        margin-top: 10px;
        display: none;
    }

    .notes-block.open {
        display: block;
        animation: fadeIn 0.25s ease;
    }

    .notes-textarea {
        width: 100%;
        min-height: 70px;
        resize: vertical;
        background: rgba(255, 255, 255, 0.75);
        border: 1px solid rgba(200, 120, 120, 0.4);
        border-radius: 12px;
        color: #5a2a2a;
        padding: 10px;
        font-size: 13px;
        outline: none;
        font-family: inherit;
        transition: 0.2s;
    }

    .notes-textarea::placeholder { color: rgba(140, 80, 80, 0.55); }

    .notes-textarea:focus {
        border-color: #d68a8a;
        background: #fff;
        box-shadow: 0 0 0 3px rgba(220, 140, 140, 0.25);
    }

    .notes-indicator { color: #d17a00; }

    /* ===== Итог недели ===== */
    .week-total {
        margin-top: 15px;
        padding: 14px;
        border-radius: 16px;
        background: rgba(255, 230, 230, 0.7);
        border: 1px solid rgba(220, 140, 140, 0.5);
        backdrop-filter: blur(12px);
        animation: fadeIn 0.35s ease;
    }

    .week-total-title {
        font-size: 15px;
        font-weight: 700;
        color: #7a2f2f;
        margin-bottom: 10px;
    }

    .week-total-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 10px;
    }

    .week-total-amount {
        font-size: 18px;
        font-weight: 800;
        color: #1e6b3a;
        background: rgba(200, 245, 215, 0.8);
        padding: 6px 16px;
        border-radius: 12px;
        border: 1px solid rgba(120, 220, 150, 0.6);
    }

    .week-total-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px 18px;
        font-size: 14px;
    }

    .week-total-grid .k { color: #8a5a5a; }

    .week-total-grid .v {
        color: #5a2a2a;
        font-weight: 700;
        text-align: right;
    }

    .empty-text {
        text-align: center;
        color: rgba(140, 80, 80, 0.75);
        font-size: 14px;
        padding: 20px;
        font-style: italic;
    }

    .month-empty {
        text-align: center;
        color: rgba(140, 80, 80, 0.75);
        font-size: 14px;
        padding: 24px;
        font-style: italic;
    }

    @media (max-width: 480px) {
        .hours-input { width: 70px; }
        .hours-word { font-size: 13px; }
        .money { font-size: 14px; }
        .week-title { font-size: 15px; }
        .week-total-grid { grid-template-columns: 1fr; }
        .total-value, .total-money { font-size: 13px; padding: 4px 10px; }
        .month-name { font-size: 17px; }
    }
</style>
</head>
<body>

<h1>📅 График смен</h1>

<div class="main-container">
    <!-- Выбор месяца -->
    <div class="month-selector">
        <button class="month-arrow" onclick="changeMonth(-1)" title="Предыдущий месяц">‹</button>
        <div class="month-name" id="monthName">—</div>
        <button class="month-arrow" onclick="changeMonth(1)" title="Следующий месяц">›</button>
    </div>

    <!-- Кнопка создания недели -->
    <button class="btn btn-create-week hidden" id="createWeekBtn" onclick="createWeek()">➕ Добавить неделю</button>

    <div id="weeksContainer"></div>
</div>

<script>
    const STORAGE_KEY = 'shiftScheduleData_v2';
    const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь',
                    'Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
    const HOUR_RATE = 300;

    let data = {
        currentMonthIndex: new Date().getMonth(),
        weeks: []
    };

    let weekCounter = 0;
    let dayCounter = 0;

    function loadData() {
        try {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                data = JSON.parse(saved);
                if (typeof data.currentMonthIndex !== 'number') {
                    data.currentMonthIndex = new Date().getMonth();
                }
                if (!Array.isArray(data.weeks)) data.weeks = [];
                data.weeks.forEach(w => {
                    if (typeof w.closed === 'undefined') w.closed = false;
                    if (typeof w.monthIndex === 'undefined') w.monthIndex = data.currentMonthIndex;
                    weekCounter = Math.max(weekCounter, w.id + 1);
                    w.days.forEach(d => {
                        if (typeof d.paid === 'undefined') d.paid = null;
                        if (typeof d.collapsed === 'undefined') d.collapsed = false;
                        if (typeof d.hours === 'undefined') d.hours = 0;
                        dayCounter = Math.max(dayCounter, d.id + 1);
                    });
                });
            }
        } catch (e) { console.error('Ошибка загрузки:', e); }
    }

    function saveData() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
        catch (e) { console.error('Ошибка сохранения:', e); }
    }

    function changeMonth(delta) {
        let newIndex = data.currentMonthIndex + delta;
        if (newIndex < 0) newIndex = 11;
        if (newIndex > 11) newIndex = 0;
        data.currentMonthIndex = newIndex;
        saveData();
        render();
    }

    function getCurrentMonthName() {
        return MONTHS[data.currentMonthIndex];
    }

    function createWeek() {
        data.weeks.push({
            id: weekCounter++,
            monthIndex: data.currentMonthIndex,
            closed: false,
            days: []
        });
        saveData();
        render();
    }

    function deleteWeek(weekId) {
        if (!confirm('Удалить неделю со всеми днями?')) return;
        data.weeks = data.weeks.filter(w => w.id !== weekId);
        saveData();
        render();
    }

    function toggleFinishWeek(weekId) {
        const week = data.weeks.find(w => w.id === weekId);
        if (!week) return;
        week.closed = !week.closed;
        saveData();
        render();
    }

    function createDay(weekId) {
        const week = data.weeks.find(w => w.id === weekId);
        if (!week) return;
        if (week.closed) { alert('Неделя завершена. Разверните её для редактирования.'); return; }
        week.days.push({
            id: dayCounter++,
            date: '',
            hours: 0,
            notes: '',
            paid: null,
            collapsed: false
        });
        saveData();
        render();
    }

    function deleteDay(weekId, dayId) {
        if (!confirm('Удалить этот день?')) return;
        const week = data.weeks.find(w => w.id === weekId);
        if (!week) return;
        week.days = week.days.filter(d => d.id !== dayId);
        saveData();
        render();
    }

    function toggleDayCollapse(weekId, dayId) {
        const week = data.weeks.find(w => w.id === weekId);
        if (!week) return;
        const day = week.days.find(d => d.id === dayId);
        if (!day) return;
        day.collapsed = !day.collapsed;
        saveData();
        render();
    }

    function updateDay(weekId, dayId, field, value) {
        const week = data.weeks.find(w => w.id === weekId);
        if (!week) return;
        const day = week.days.find(d => d.id === dayId);
        if (!day) return;

        if (field === 'hours') {
            let num = parseInt(value, 10);
            if (isNaN(num) || num < 0) num = 0;
            day.hours = num;
        } else {
            day[field] = value;
        }
        saveData();
    }

    function openPaidDialog(weekId, targetDayId) {
        const week = data.weeks.find(w => w.id === weekId);
        if (!week) return;

        if (targetDayId === null) {
            const current = week.paid == null ? '' : week.paid;
            const input = prompt('Введите сумму, оплаченную за неделю (руб.):', current);
            if (input === null) return;
            const cleaned = input.replace(/[^0-9]/g, '');
            week.paid = cleaned === '' ? null : parseInt(cleaned, 10);
        } else {
            const day = week.days.find(d => d.id === targetDayId);
            if (!day) return;
            const current = day.paid == null ? '' : day.paid;
            const input = prompt('Введите сумму, оплаченную за смену (руб.):', current);
            if (input === null) return;
            const cleaned = input.replace(/[^0-9]/g, '');
            day.paid = cleaned === '' ? null : parseInt(cleaned, 10);
        }
        saveData();
        render();
    }

    function getDayTotals(day) {
        const hours = day.hours || 0;
        return { hours, money: hours * HOUR_RATE };
    }

    function getPaidStatus(paid, expected) {
        if (paid == null) return null;
        if (paid === expected) return 'match';
        if (paid < expected) return 'less';
        return 'more';
    }

    function getWeekTotals(week) {
        let hours = 0, money = 0;
        week.days.forEach(d => {
            const t = getDayTotals(d);
            hours += t.hours;
            money += t.money;
        });
        const paid = week.paid == null ? null : week.paid;
        return { hours, money, paid, diff: paid == null ? null : paid - money };
    }

    function render() {
        document.getElementById('monthName').textContent = getCurrentMonthName();

        const createBtn = document.getElementById('createWeekBtn');
        createBtn.classList.remove('hidden');

        const container = document.getElementById('weeksContainer');
        container.innerHTML = '';

        const monthWeeks = data.weeks.filter(w => w.monthIndex === data.currentMonthIndex);

        if (monthWeeks.length === 0) {
            container.innerHTML = '<div class="month-empty">В этом месяце пока нет недель. Нажмите «Добавить неделю».</div>';
            return;
        }

        monthWeeks.forEach((week, wIndex) => {
            const weekEl = document.createElement('div');
            weekEl.className = 'week-block' + (week.closed ? ' closed' : '');

            weekEl.innerHTML = `
                <div class="week-header">
                    <div class="week-title">📆 ${getCurrentMonthName()} — Неделя ${wIndex + 1}${week.closed ? ' ✅' : ''}</div>
                    <div class="week-actions">
                        <button class="btn btn-small btn-finish ${week.closed ? 'finished' : ''}" 
                                onclick="toggleFinishWeek(${week.id})">
                            ${week.closed ? '↩ Развернуть неделю' : '🏁 Завершить неделю'}
                        </button>
                        <button class="btn btn-small btn-danger" onclick="deleteWeek(${week.id})">🗑</button>
                    </div>
                </div>
                ${!week.closed ? `<div class="days-grid" id="days-${week.id}"></div>` : ''}
                <div id="total-${week.id}"></div>
            `;
            container.appendChild(weekEl);

            if (!week.closed) {
                const daysGrid = weekEl.querySelector(`#days-${week.id}`);
                week.days.forEach(day => {
                    daysGrid.appendChild(buildDayCard(week.id, day));
                });

                const addTile = document.createElement('div');
                addTile.className = 'add-day-tile';
                addTile.textContent = '＋';
                addTile.title = 'Добавить день';
                addTile.onclick = () => createDay(week.id);
                daysGrid.appendChild(addTile);
            }

            const totalsEl = weekEl.querySelector(`#total-${week.id}`);
            totalsEl.appendChild(buildWeekTotal(week));
        });
    }

    function buildWeekTotal(week) {
        const t = getWeekTotals(week);
        const el = document.createElement('div');
        el.className = 'week-total';

        const status = getPaidStatus(t.paid, t.money);
        let paidBtnClass = 'paid-btn';
        let paidBtnText = '💰 Оплачена';
        if (status === 'match') { paidBtnClass += ' status-match'; paidBtnText = `✅ ${t.paid} руб.`; }
        else if (status === 'less') { paidBtnClass += ' status-less'; paidBtnText = `⬇ ${t.paid} руб.`; }
        else if (status === 'more') { paidBtnClass += ' status-more'; paidBtnText = `⬆ ${t.paid} руб.`; }

        let diffText = '—';
        let diffColor = '#8a5a5a';
        if (t.diff != null) {
            const sign = t.diff > 0 ? '+' : '';
            diffText = sign + t.diff + ' руб.';
            if (t.diff === 0) diffColor = '#1e6b3a';
            else if (t.diff > 0) diffColor = '#6a2ea0';
            else diffColor = '#b02020';
        }

        el.innerHTML = `
            <div class="week-total-title">Итог за неделю</div>
            <div class="week-total-row">
                <span class="week-total-amount">${t.money} руб.</span>
                <button class="${paidBtnClass}" onclick="openPaidDialog(${week.id}, null)">
                    ${paidBtnText}
                </button>
            </div>
            <div class="week-total-grid">
                <span class="k">Всего часов:</span>
                <span class="v">${t.hours}</span>

                <span class="k">Оплачено:</span>
                <span class="v">${t.paid != null ? t.paid + ' руб.' : '—'}</span>

                <span class="k">Разница:</span>
                <span class="v" style="color:${diffColor}">${diffText}</span>
            </div>
        `;
        return el;
    }

    function buildDayCard(weekId, day) {
        const card = document.createElement('div');
        card.className = 'day-card' + (day.collapsed ? ' collapsed' : '');

        const { hours, money } = getDayTotals(day);
        const status = getPaidStatus(day.paid, money);

        let paidBtnClass = 'paid-btn';
        let paidBtnText = '💰 Оплачено';
        if (status === 'match') { paidBtnClass += ' status-match'; paidBtnText = `✅ ${day.paid} руб.`; }
        else if (status === 'less') { paidBtnClass += ' status-less'; paidBtnText = `⬇ ${day.paid} руб.`; }
        else if (status === 'more') { paidBtnClass += ' status-more'; paidBtnText = `⬆ ${day.paid} руб.`; }

        const summaryText = day.collapsed
            ? `${day.date || 'без даты'} · ${hours} ч · ${money} руб.`
            : '';

        card.innerHTML = `
            <div class="day-top">
                <input type="text" class="day-number-input" placeholder="02.10" 
                       value="${escapeHtml(day.date)}"
                       oninput="updateDay(${weekId}, ${day.id}, 'date', this.value)">
                <span class="day-summary">${summaryText}</span>
                <div class="day-top-btns">
                    <button class="icon-btn notes-indicator" title="Примечания" 
                            onclick="toggleNotes(this)">📝</button>
                    <button class="icon-btn" title="${day.collapsed ? 'Развернуть' : 'Свернуть'}" 
                            onclick="toggleDayCollapse(${weekId}, ${day.id})">
                        ${day.collapsed ? '▸' : '▾'}
                    </button>
                    <button class="icon-btn" title="Удалить день" 
                            onclick="deleteDay(${weekId}, ${day.id})">✕</button>
                </div>
            </div>

            <div class="day-body">
                <div class="shift-row">
                    <input type="number" class="hours-input" min="0" placeholder="0"
                           value="${day.hours || ''}"
                           oninput="onHoursInput(this, ${weekId}, ${day.id})">
                    <span class="hours-word">часов</span>
                    <span class="money">${money} руб.</span>
                </div>

                <div class="total-row">
                    <span class="total-label">Итого за смену:</span>
                    <div class="total-block">
                        <span class="total-value">${hours} ч</span>
                        <span class="total-money">${money} руб.</span>
                    </div>
                    <button class="${paidBtnClass}" onclick="openPaidDialog(${weekId}, ${day.id})">
                        ${paidBtnText}
                    </button>
                </div>

                <div class="notes-block ${day.notes ? 'open' : ''}">
                    <textarea class="notes-textarea" placeholder="Дополнительные комментарии..."
                              oninput="updateDay(${weekId}, ${day.id}, 'notes', this.value)">${escapeHtml(day.notes)}</textarea>
                </div>
            </div>
        `;
        return card;
    }

    function onHoursInput(input, weekId, dayId) {
        let val = input.value.replace(/[^0-9]/g, '');
        input.value = val;
        updateDay(weekId, dayId, 'hours', val);

        const week = data.weeks.find(w => w.id === weekId);
        if (!week) return;
        const day = week.days.find(d => d.id === dayId);
        if (!day) return;

        const card = input.closest('.day-card');
        const { hours, money } = getDayTotals(day);

        card.querySelector('.money').textContent = money + ' руб.';
        card.querySelector('.total-value').textContent = hours + ' ч';
        card.querySelector('.total-money').textContent = money + ' руб.';

        const paidBtn = card.querySelector('.paid-btn');
        if (paidBtn && day.paid != null) {
            paidBtn.classList.remove('status-match', 'status-less', 'status-more');
            const status = getPaidStatus(day.paid, money);
            if (status === 'match') { paidBtn.classList.add('status-match'); paidBtn.textContent = `✅ ${day.paid} руб.`; }
            else if (status === 'less') { paidBtn.classList.add('status-less'); paidBtn.textContent = `⬇ ${day.paid} руб.`; }
            else if (status === 'more') { paidBtn.classList.add('status-more'); paidBtn.textContent = `⬆ ${day.paid} руб.`; }
        }
    }

    function toggleNotes(btn) {
        const card = btn.closest('.day-card');
        const notes = card.querySelector('.notes-block');
        notes.classList.toggle('open');
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;')
            .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    loadData();
    render();
</script>

</body>
</html>
