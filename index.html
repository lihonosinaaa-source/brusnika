<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>График брусники</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }

    body {
        min-height: 100vh;
        background-color: #f7e9e9;
        background-image: url('https://e.radikal.host/2026/10/05/IMG_4283.png');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        background-repeat: no-repeat;
        padding: 30px 15px;
        color: #5a2a2a;
    }

    body::before {
        content: '';
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(255, 235, 235, 0.18);
        backdrop-filter: blur(1px);
        -webkit-backdrop-filter: blur(1px);
        z-index: -1;
    }

    h1 {
        text-align: center;
        font-weight: 300;
        letter-spacing: 2px;
        margin-bottom: 22px;
        color: #7a2f2f;
        text-shadow: 0 2px 10px rgba(255,255,255,0.8);
        font-size: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
    }

    h1 svg { width: 30px; height: 30px; }

    .main-container { max-width: 720px; margin: 0 auto; }

    .icon { width: 18px; height: 18px; flex-shrink: 0; }
    .icon-sm { width: 14px; height: 14px; }

    .btn {
        background: rgba(255, 255, 255, 0.55);
        border: 1px solid rgba(200, 120, 120, 0.5);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        color: #7a2f2f;
        padding: 11px 20px;
        border-radius: 14px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        transition: all 0.2s ease;
        box-shadow: 0 4px 20px rgba(200, 120, 120, 0.25);
        display: inline-flex;
        align-items: center;
        gap: 7px;
    }

    .btn:hover {
        background: rgba(255, 255, 255, 0.85);
        transform: translateY(-1px);
        box-shadow: 0 6px 22px rgba(200, 120, 120, 0.4);
    }

    .btn:active { transform: translateY(0); }

    .month-selector {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
        background: rgba(255, 255, 255, 0.5);
        border: 1px solid rgba(200, 120, 120, 0.4);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border-radius: 18px;
        padding: 10px 16px;
        margin: 0 auto 20px;
        max-width: 420px;
        box-shadow: 0 6px 24px rgba(200, 120, 120, 0.2);
    }

    .month-arrow {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.7);
        border: 1px solid rgba(200, 120, 120, 0.4);
        color: #7a2f2f;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: 0.2s;
    }

    .month-arrow:hover {
        background: #fff;
        transform: scale(1.05);
    }

    .month-name {
        flex: 1;
        text-align: center;
        font-size: 18px;
        font-weight: 700;
        color: #7a2f2f;
        letter-spacing: 0.5px;
        user-select: none;
    }

    .btn-create-week {
        display: block;
        margin: 0 auto 25px;
        font-size: 16px;
        padding: 12px 28px;
    }

    .week-block {
        background: rgba(255, 255, 255, 0.5);
        border: 1px solid rgba(200, 120, 120, 0.4);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-radius: 20px;
        padding: 16px;
        margin-bottom: 18px;
        box-shadow: 0 8px 32px rgba(200, 120, 120, 0.25);
    }

    .week-block.closed {
        border-color: rgba(120, 200, 140, 0.6);
        box-shadow: 0 8px 32px rgba(120, 200, 140, 0.25);
        padding: 12px 16px;
    }

    .week-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
    }

    .week-block:not(.closed) .week-header {
        margin-bottom: 14px;
        padding-bottom: 12px;
        border-bottom: 1px solid rgba(200, 120, 120, 0.25);
    }

    .week-title {
        font-size: 16px;
        font-weight: 700;
        color: #7a2f2f;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .week-summary {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 1;
        flex-wrap: wrap;
    }

    .summary-item {
        font-size: 13px;
        color: #8a5a5a;
        background: rgba(255, 210, 210, 0.6);
        padding: 4px 10px;
        border-radius: 8px;
        border: 1px solid rgba(220, 140, 140, 0.5);
        white-space: nowrap;
    }

    .summary-item.green {
        color: #1e6b3a;
        background: rgba(200, 245, 215, 0.7);
        border-color: rgba(120, 220, 150, 0.6);
    }

    .week-actions { display: flex; gap: 6px; }

    .btn-small { padding: 7px 12px; font-size: 13px; border-radius: 10px; }

    .btn-icon {
        padding: 6px 8px;
        font-size: 13px;
        border-radius: 9px;
        min-width: 32px;
        justify-content: center;
    }

    .btn-danger {
        background: rgba(255, 180, 180, 0.55);
        border-color: rgba(230, 120, 120, 0.6);
        color: #8a2a2a;
    }

    .btn-danger:hover { background: rgba(255, 160, 160, 0.85); }

    .btn-finish {
        background: rgba(255, 210, 210, 0.6);
        border-color: rgba(220, 140, 140, 0.6);
        color: #7a2f2f;
    }

    .btn-finish:hover { background: rgba(255, 190, 190, 0.9); }

    .add-day-tile {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 52px;
        height: 52px;
        border-radius: 14px;
        background: rgba(255, 200, 200, 0.5);
        border: 2px dashed rgba(200, 100, 100, 0.6);
        cursor: pointer;
        color: #8a2a2a;
        transition: all 0.25s ease;
        backdrop-filter: blur(10px);
    }

    .add-day-tile:hover {
        background: rgba(255, 180, 180, 0.75);
        transform: scale(1.06);
        border-color: #8a2a2a;
    }

    .days-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: flex-start;
    }

    .day-card {
        width: 100%;
        background: rgba(255, 255, 255, 0.55);
        border: 1px solid rgba(200, 120, 120, 0.35);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border-radius: 16px;
        padding: 12px 14px;
        box-shadow: 0 6px 24px rgba(200, 120, 120, 0.2);
        animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .day-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
    }

    .day-card:not(.collapsed) .day-top { margin-bottom: 10px; }

    .day-date-badge {
        background: rgba(255, 210, 210, 0.7);
        border: 1px solid rgba(220, 140, 140, 0.5);
        color: #7a2f2f;
        padding: 5px 12px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 700;
        white-space: nowrap;
    }

    .day-summary {
        display: flex;
        align-items: center;
        gap: 6px;
        flex: 1;
        flex-wrap: wrap;
    }

    .day-top-btns { display: flex; gap: 5px; }

    .icon-btn {
        background: rgba(255, 255, 255, 0.7);
        border: 1px solid rgba(200, 120, 120, 0.4);
        color: #7a2f2f;
        width: 30px;
        height: 30px;
        border-radius: 8px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: 0.2s;
    }

    .icon-btn:hover { background: #fff; transform: scale(1.05); }

    .date-picker {
        display: flex;
        align-items: center;
        gap: 6px;
        background: rgba(255, 255, 255, 0.6);
        border: 1px solid rgba(200, 120, 120, 0.4);
        border-radius: 10px;
        padding: 3px 6px;
    }

    .date-picker button {
        background: transparent;
        border: none;
        color: #7a2f2f;
        cursor: pointer;
        padding: 2px 6px;
        font-size: 14px;
        border-radius: 6px;
        transition: 0.15s;
        display: flex;
        align-items: center;
    }

    .date-picker button:hover { background: rgba(255, 210, 210, 0.6); }

    .date-picker-value {
        min-width: 58px;
        text-align: center;
        font-size: 14px;
        font-weight: 700;
        color: #7a2f2f;
        padding: 3px 4px;
        user-select: none;
    }

    /* ===== Одна строка часов ===== */
    .shift-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 0;
    }

    .hours-input {
        width: 110px;
        background: rgba(255, 255, 255, 0.75);
        border: 1px solid rgba(200, 120, 120, 0.4);
        border-radius: 9px;
        color: #5a2a2a;
        padding: 9px 11px;
        font-size: 16px;
        text-align: center;
        outline: none;
        transition: 0.2s;
        font-weight: 700;
    }

    .hours-input::-webkit-outer-spin-button,
    .hours-input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
    }

    .hours-input:focus {
        border-color: #d68a8a;
        background: #fff;
        box-shadow: 0 0 0 3px rgba(220, 140, 140, 0.25);
    }

    .hours-word {
        font-size: 15px;
        color: #8a5a5a;
        flex-shrink: 0;
        font-weight: 600;
    }

    .money {
        margin-left: auto;
        font-weight: 700;
        color: #b05050;
        font-size: 17px;
        white-space: nowrap;
    }

    .total-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 8px;
        padding-top: 10px;
        border-top: 1px solid rgba(200, 120, 120, 0.3);
        gap: 8px;
        flex-wrap: wrap;
    }

    .total-label {
        font-size: 14px;
        font-weight: 700;
        color: #7a2f2f;
    }

    .total-block {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-left: auto;
        flex-wrap: wrap;
    }

    .total-value {
        font-size: 14px;
        font-weight: 700;
        color: #7a2f2f;
        background: rgba(255, 210, 210, 0.7);
        padding: 4px 12px;
        border-radius: 9px;
        border: 1px solid rgba(220, 140, 140, 0.5);
        white-space: nowrap;
    }

    .total-money {
        font-size: 14px;
        font-weight: 700;
        color: #1e6b3a;
        background: rgba(200, 245, 215, 0.7);
        padding: 4px 12px;
        border-radius: 9px;
        border: 1px solid rgba(120, 220, 150, 0.6);
        white-space: nowrap;
    }

    .paid-btn {
        font-size: 13px;
        font-weight: 700;
        color: #fff;
        background: rgba(180, 130, 130, 0.75);
        padding: 5px 12px;
        border-radius: 9px;
        border: 1px solid rgba(150, 100, 100, 0.6);
        cursor: pointer;
        transition: all 0.2s ease;
        white-space: nowrap;
    }

    .paid-btn:hover { transform: translateY(-1px); filter: brightness(1.08); }

    .paid-btn.status-match {
        background: rgba(80, 210, 130, 0.85);
        border-color: rgba(60, 190, 110, 0.95);
        box-shadow: 0 0 12px rgba(80, 210, 130, 0.55);
    }

    .paid-btn.status-less {
        background: rgba(240, 90, 90, 0.85);
        border-color: rgba(220, 70, 70, 0.95);
        box-shadow: 0 0 12px rgba(240, 90, 90, 0.55);
    }

    .paid-btn.status-more {
        background: rgba(180, 120, 240, 0.85);
        border-color: rgba(160, 100, 220, 0.95);
        box-shadow: 0 0 12px rgba(180, 120, 240, 0.55);
    }

    .notes-block { margin-top: 10px; display: none; }
    .notes-block.open { display: block; animation: fadeIn 0.2s ease; }

    .notes-textarea {
        width: 100%;
        min-height: 65px;
        resize: vertical;
        background: rgba(255, 255, 255, 0.75);
        border: 1px solid rgba(200, 120, 120, 0.4);
        border-radius: 11px;
        color: #5a2a2a;
        padding: 10px;
        font-size: 13px;
        outline: none;
        font-family: inherit;
        transition: 0.2s;
    }

    .notes-textarea::placeholder { color: rgba(140, 80, 80, 0.55); }

    .notes-textarea:focus {
        border-color: #d68a8a;
        background: #fff;
        box-shadow: 0 0 0 3px rgba(220, 140, 140, 0.25);
    }

    .week-total {
        margin-top: 14px;
        padding: 14px;
        border-radius: 14px;
        background: rgba(255, 230, 230, 0.7);
        border: 1px solid rgba(220, 140, 140, 0.5);
        backdrop-filter: blur(12px);
        animation: fadeIn 0.3s ease;
    }

    .week-total-title {
        font-size: 14px;
        font-weight: 700;
        color: #7a2f2f;
        margin-bottom: 10px;
    }

    .total-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 14px;
    }

    .total-line {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 2px 0;
    }

    .total-line .k { color: #8a5a5a; }

    .total-line .v {
        color: #5a2a2a;
        font-weight: 700;
        text-align: right;
        white-space: nowrap;
    }

    .total-line .v.highlight { color: #1e6b3a; font-size: 15px; }

    .empty-text {
        text-align: center;
        color: rgba(140, 80, 80, 0.75);
        font-size: 14px;
        padding: 24px;
        font-style: italic;
    }

    @media (max-width: 480px) {
        .hours-input { width: 90px; font-size: 15px; }
        .hours-word { font-size: 13px; }
        .money { font-size: 15px; }
        .week-title { font-size: 14px; }
        .total-value, .total-money { font-size: 12px; padding: 3px 8px; }
        .month-name { font-size: 16px; }
        .day-date-badge { font-size: 12px; padding: 4px 9px; }
        .total-line { font-size: 13px; }
    }
</style>
</head>
<body>

<h1>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2C8 2 5 5 5 9c0 3 2 5 3 6v5a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-5c1-1 3-3 3-6 0-4-3-7-7-7z"></path>
        <path d="M12 2v6"></path>
    </svg>
    График брусники
</h1>

<div class="main-container">

    <div class="month-selector">
        <button class="month-arrow" onclick="changeMonth(-1)" title="Предыдущий месяц">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </button>
        <div class="month-name" id="monthName">—</div>
        <button class="month-arrow" onclick="changeMonth(1)" title="Следующий месяц">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
        </button>
    </div>

    <button class="btn btn-create-week" onclick="createWeek()">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        Создать неделю
    </button>

    <div id="weeksContainer"></div>
</div>

<script>
    const STORAGE_KEY = 'brusnikaScheduleData_v3';
    const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь',
                    'Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
    const RATE = 300;

    let data = { currentMonthIndex: new Date().getMonth(), weeks: [] };
    let weekCounter = 0;
    let dayCounter = 0;

    const ICONS = {
        chevronLeft:  '<svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>',
        chevronRight: '<svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>',
        chevronDown:  '<svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>',
        plus:         '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>',
        trash:        '<svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>',
        check:        '<svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>',
        checkCircle:  '<svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>',
        note:         '<svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>',
        wallet:       '<svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12V8H6a2 2 0 0 1 0-4h12v4"></path><path d="M4 6v12a2 2 0 0 0 2 2h14v-4"></path><path d="M18 12a2 2 0 0 0 0 4h4v-4z"></path></svg>',
        flag:         '<svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path><line x1="4" y1="22" x2="4" y2="15"></line></svg>',
        calendar:     '<svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>'
    };

    function pad(n) { return String(n).padStart(2, '0'); }
    function today() { const d = new Date(); return { d: d.getDate(), m: d.getMonth() + 1, y: d.getFullYear() }; }
    function formatDate(day, month) { return pad(day) + '.' + pad(month); }

    /* ===== Парсинг часов (дробные значения) ===== */
    function parseHours(str) {
        if (str == null || str === '') return 0;
        // заменяем запятую на точку
        let cleaned = String(str).replace(',', '.').replace(/[^0-9.]/g, '');
        // отсекаем лишние точки
        const parts = cleaned.split('.');
        if (parts.length > 1) cleaned = parts[0] + '.' + parts.slice(1).join('');
        const num = parseFloat(cleaned);
        if (isNaN(num) || num < 0) return 0;
        return num;
    }

    /* Формат часов для отображения — убираем лишние нули */
    function formatHours(h) {
        if (h == null || isNaN(h)) return '0';
        // округляем до 2 знаков
        const r = Math.round(h * 100) / 100;
        // если целое — показываем без десятичных
        if (r === Math.floor(r)) return String(r);
        // заменяем точку на запятую
        return String(r).replace('.', ',');
    }

    function loadData() {
        try {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                data = JSON.parse(saved);
                if (typeof data.currentMonthIndex !== 'number') data.currentMonthIndex = new Date().getMonth();
                if (!Array.isArray(data.weeks)) data.weeks = [];
                data.weeks.forEach(w => {
                    if (typeof w.closed === 'undefined') w.closed = false;
                    if (typeof w.paid === 'undefined') w.paid = null;
                    if (typeof w.monthIndex === 'undefined') w.monthIndex = data.currentMonthIndex;
                    weekCounter = Math.max(weekCounter, w.id + 1);
                    w.days.forEach(d => {
                        if (typeof d.paid === 'undefined') d.paid = null;
                        if (typeof d.closed === 'undefined') d.closed = false;
                        if (typeof d.dayNum === 'undefined') d.dayNum = null;
                        if (typeof d.monthNum === 'undefined') d.monthNum = null;
                        // миграция со старого формата (night/day/evening)
                        if (typeof d.hours === 'undefined') {
                            const n = (d.night || 0) + (d.day || 0) + (d.evening || 0);
                            d.hours = n;
                        }
                        dayCounter = Math.max(dayCounter, d.id + 1);
                    });
                });
            }
        } catch (e) { console.error('Ошибка загрузки:', e); }
    }

    function saveData() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
        catch (e) { console.error('Ошибка сохранения:', e); }
    }

    function changeMonth(delta) {
        let i = data.currentMonthIndex + delta;
        if (i < 0) i = 11;
        if (i > 11) i = 0;
        data.currentMonthIndex = i;
        saveData();
        render();
    }
    function getMonthName() { return MONTHS[data.currentMonthIndex]; }

    function createWeek() {
        data.weeks.push({
            id: weekCounter++,
            monthIndex: data.currentMonthIndex,
            closed: false, paid: null, days: []
        });
        saveData();
        render();
    }

    function deleteWeek(id) {
        if (!confirm('Удалить неделю со всеми днями?')) return;
        data.weeks = data.weeks.filter(w => w.id !== id);
        saveData();
        render();
    }

    function toggleFinishWeek(id) {
        const w = data.weeks.find(x => x.id === id);
        if (!w) return;
        w.closed = !w.closed;
        saveData();
        render();
    }

    function createDay(weekId) {
        const w = data.weeks.find(x => x.id === weekId);
        if (!w) return;
        if (w.closed) { alert('Неделя завершена. Разверните её.'); return; }

        const t = today();
        w.days.push({
            id: dayCounter++,
            dayNum: t.d, monthNum: t.m,
            hours: 0,
            notes: '', paid: null, closed: false
        });
        saveData();
        render();
    }

    function deleteDay(weekId, dayId) {
        if (!confirm('Удалить этот день?')) return;
        const w = data.weeks.find(x => x.id === weekId);
        if (!w) return;
        w.days = w.days.filter(d => d.id !== dayId);
        saveData();
        render();
    }

    function toggleDayClose(weekId, dayId) {
        const w = data.weeks.find(x => x.id === weekId);
        if (!w) return;
        const d = w.days.find(x => x.id === dayId);
        if (!d) return;
        d.closed = !d.closed;
        saveData();
        render();
    }

    function changeDayNum(weekId, dayId, delta) {
        const w = data.weeks.find(x => x.id === weekId);
        if (!w) return;
        const d = w.days.find(x => x.id === dayId);
        if (!d) return;

        let day = (d.dayNum || 1) + delta;
        let month = d.monthNum || (new Date().getMonth() + 1);
        if (day < 1) { day = 31; month--; if (month < 1) month = 12; }
        if (day > 31) { day = 1; month++; if (month > 12) month = 1; }
        d.dayNum = day;
        d.monthNum = month;
        saveData();
        render();
    }

    /* Сохраняем «сырое» значение часов из поля */
    function updateDayHours(weekId, dayId, rawValue) {
        const w = data.weeks.find(x => x.id === weekId);
        if (!w) return;
        const d = w.days.find(x => x.id === dayId);
        if (!d) return;
        d.hours = parseHours(rawValue);
        saveData();
    }

    function updateDay(weekId, dayId, field, value) {
        const w = data.weeks.find(x => x.id === weekId);
        if (!w) return;
        const d = w.days.find(x => x.id === dayId);
        if (!d) return;
        d[field] = value;
        saveData();
    }

    function openPaidDay(weekId, dayId) {
        const w = data.weeks.find(x => x.id === weekId);
        if (!w) return;
        const d = w.days.find(x => x.id === dayId);
        if (!d) return;
        const cur = d.paid == null ? '' : d.paid;
        const v = prompt('Введите сумму, оплаченную за смену (руб.):', cur);
        if (v === null) return;
        const cleaned = v.replace(/[^0-9]/g, '');
        d.paid = cleaned === '' ? null : parseInt(cleaned, 10);
        saveData();
        render();
    }

    function openPaidWeek(weekId) {
        const w = data.weeks.find(x => x.id === weekId);
        if (!w) return;
        const cur = w.paid == null ? '' : w.paid;
        const v = prompt('Введите сумму, оплаченную за неделю (руб.). Если оставить пустым — будет использоваться сумма оплат по дням:', cur);
        if (v === null) return;
        const cleaned = v.replace(/[^0-9]/g, '');
        w.paid = cleaned === '' ? null : parseInt(cleaned, 10);
        saveData();
        render();
    }

    /* ===== Итоги (без налога) ===== */
    function getDayTotals(day) {
        const hours = day.hours || 0;
        const money = Math.round(hours * RATE);
        return { hours, money };
    }

    function getDaysPaidSum(week) {
        let sum = 0, count = 0;
        week.days.forEach(d => {
            if (d.paid != null) { sum += d.paid; count++; }
        });
        return { sum, count };
    }

    function getWeekTotals(week) {
        let hours = 0, money = 0;
        week.days.forEach(d => {
            const t = getDayTotals(d);
            hours += t.hours;
            money += t.money;
        });

        const daysPaid = getDaysPaidSum(week);
        let paid = null;
        let paidSource = 'none';
        if (week.paid != null) {
            paid = week.paid;
            paidSource = 'week';
        } else if (daysPaid.count > 0) {
            paid = daysPaid.sum;
            paidSource = 'days';
        }

        return {
            hours, money,
            paid, paidSource,
            daysPaid: daysPaid.sum,
            daysPaidCount: daysPaid.count,
            diff: paid == null ? null : paid - money
        };
    }

    function getPaidStatus(paid, expected) {
        if (paid == null) return null;
        if (paid === expected) return 'match';
        if (paid < expected) return 'less';
        return 'more';
    }

    function render() {
        document.getElementById('monthName').textContent = getMonthName();
        const container = document.getElementById('weeksContainer');
        container.innerHTML = '';

        const monthWeeks = data.weeks.filter(w => w.monthIndex === data.currentMonthIndex);

        if (monthWeeks.length === 0) {
            container.innerHTML = '<div class="empty-text">В этом месяце пока нет недель. Нажмите «Создать неделю».</div>';
            return;
        }

        monthWeeks.forEach((week, wIdx) => {
            container.appendChild(buildWeek(week, wIdx));
        });
    }

    function buildWeek(week, wIdx) {
        const el = document.createElement('div');
        el.className = 'week-block' + (week.closed ? ' closed' : '');
        const t = getWeekTotals(week);

        if (week.closed) {
            const status = getPaidStatus(t.paid, t.money);
            let paidShort = t.paid == null ? '—' : t.paid + ' ₽';
            let paidColor = '';
            if (status === 'match') paidColor = '#1e6b3a';
            else if (status === 'less') paidColor = '#b02020';
            else if (status === 'more') paidColor = '#6a2ea0';

            el.innerHTML = `
                <div class="week-header">
                    <div class="week-title">${ICONS.checkCircle} Неделя ${wIdx + 1}</div>
                    <div class="week-summary">
                        <span class="summary-item green">${t.money} ₽</span>
                        <span class="summary-item">Оплачено: <b style="color:${paidColor}">${paidShort}</b></span>
                    </div>
                    <div class="week-actions">
                        <button class="btn btn-small btn-icon btn-finish" title="Развернуть" onclick="toggleFinishWeek(${week.id})">
                            ${ICONS.chevronDown}
                        </button>
                        <button class="btn btn-small btn-icon btn-danger" title="Удалить" onclick="deleteWeek(${week.id})">
                            ${ICONS.trash}
                        </button>
                    </div>
                </div>
            `;
            return el;
        }

        el.innerHTML = `
            <div class="week-header">
                <div class="week-title">${ICONS.calendar} ${getMonthName()} — Неделя ${wIdx + 1}</div>
                <div class="week-actions">
                    <button class="btn btn-small btn-finish" onclick="toggleFinishWeek(${week.id})">
                        ${ICONS.flag} Завершить неделю
                    </button>
                    <button class="btn btn-small btn-icon btn-danger" title="Удалить" onclick="deleteWeek(${week.id})">
                        ${ICONS.trash}
                    </button>
                </div>
            </div>
            <div class="days-grid" id="days-${week.id}"></div>
            <div id="total-${week.id}"></div>
        `;

        setTimeout(() => {
            const daysGrid = el.querySelector(`#days-${week.id}`);
            if (!daysGrid) return;

            week.days.forEach(day => daysGrid.appendChild(buildDay(week.id, day)));

            const addTile = document.createElement('div');
            addTile.className = 'add-day-tile';
            addTile.title = 'Добавить день';
            addTile.innerHTML = ICONS.plus;
            addTile.onclick = () => createDay(week.id);
            daysGrid.appendChild(addTile);

            const totalsEl = el.querySelector(`#total-${week.id}`);
            totalsEl.appendChild(buildWeekTotal(week));
        }, 0);

        return el;
    }

    function buildWeekTotal(week) {
        const t = getWeekTotals(week);
        const el = document.createElement('div');
        el.className = 'week-total';

        const status = getPaidStatus(t.paid, t.money);
        let paidBtnClass = 'paid-btn';
        let paidBtnText = ICONS.wallet + ' Оплачено';
        if (status === 'match') { paidBtnClass += ' status-match'; paidBtnText = ICONS.check + ' ' + t.paid + ' ₽'; }
        else if (status === 'less')  { paidBtnClass += ' status-less';  paidBtnText = '↓ ' + t.paid + ' ₽'; }
        else if (status === 'more')  { paidBtnClass += ' status-more';  paidBtnText = '↑ ' + t.paid + ' ₽'; }

        let diffText = '—';
        let diffColor = '#8a5a5a';
        if (t.diff != null) {
            const sign = t.diff > 0 ? '+' : '';
            diffText = sign + t.diff + ' ₽';
            if (t.diff === 0) diffColor = '#1e6b3a';
            else if (t.diff > 0) diffColor = '#6a2ea0';
            else diffColor = '#b02020';
        }

        let paidNote = '';
        if (t.paidSource === 'days') {
            paidNote = `<div class="total-line"><span class="k" style="font-size:12px; opacity:0.7;">(сумма оплат по дням)</span><span class="v"></span></div>`;
        } else if (t.paidSource === 'week') {
            paidNote = `<div class="total-line"><span class="k" style="font-size:12px; opacity:0.7;">(указано вручную за неделю)</span><span class="v"></span></div>`;
        }

        el.innerHTML = `
            <div class="week-total-title">Итог за неделю</div>
            <div class="total-list">
                <div class="total-line">
                    <span class="k">Всего часов:</span>
                    <span class="v">${formatHours(t.hours)}</span>
                </div>
                <div class="total-line">
                    <span class="k">Сумма:</span>
                    <span class="v highlight">${t.money} ₽</span>
                </div>
                <div class="total-line">
                    <span class="k">Оплачено:</span>
                    <span class="v">${t.paid != null ? t.paid + ' ₽' : '—'}</span>
                </div>
                ${paidNote}
                <div class="total-line">
                    <span class="k">Разница:</span>
                    <span class="v" style="color:${diffColor}">${diffText}</span>
                </div>
            </div>
            <div class="total-row" style="border-top: 1px solid rgba(200, 120, 120, 0.3); margin-top:12px; padding-top:12px;">
                <span class="total-label">Оплата недели:</span>
                <button class="${paidBtnClass}" onclick="openPaidWeek(${week.id})">
                    ${paidBtnText}
                </button>
            </div>
        `;
        return el;
    }

    function buildDay(weekId, day) {
        const card = document.createElement('div');
        card.className = 'day-card' + (day.closed ? ' collapsed' : '');
        const t = getDayTotals(day);
        const dateStr = (day.dayNum && day.monthNum) ? formatDate(day.dayNum, day.monthNum) : '—';

        if (day.closed) {
            const status = getPaidStatus(day.paid, t.money);
            let paidColor = '';
            if (status === 'match') paidColor = '#1e6b3a';
            else if (status === 'less') paidColor = '#b02020';
            else if (status === 'more') paidColor = '#6a2ea0';

            card.innerHTML = `
                <div class="day-top">
                    <span class="day-date-badge">${dateStr}</span>
                    <div class="day-summary">
                        <span class="summary-item">${formatHours(t.hours)} ч</span>
                        <span class="summary-item green">${t.money} ₽</span>
                        ${day.paid != null ? `<span class="summary-item">Оплачено: <b style="color:${paidColor}">${day.paid} ₽</b></span>` : ''}
                    </div>
                    <div class="day-top-btns">
                        <button class="icon-btn" title="Развернуть" onclick="toggleDayClose(${weekId}, ${day.id})">
                            ${ICONS.chevronRight}
                        </button>
                        <button class="icon-btn" title="Удалить" onclick="deleteDay(${weekId}, ${day.id})">
                            ${ICONS.trash}
                        </button>
                    </div>
                </div>
            `;
            return card;
        }

        const status = getPaidStatus(day.paid, t.money);
        let paidBtnClass = 'paid-btn';
        let paidBtnText = ICONS.wallet + ' Оплачено';
        if (status === 'match') { paidBtnClass += ' status-match'; paidBtnText = ICONS.check + ' ' + day.paid + ' ₽'; }
        else if (status === 'less')  { paidBtnClass += ' status-less';  paidBtnText = '↓ ' + day.paid + ' ₽'; }
        else if (status === 'more')  { paidBtnClass += ' status-more';  paidBtnText = '↑ ' + day.paid + ' ₽'; }

        card.innerHTML = `
            <div class="day-top">
                <div class="date-picker">
                    <button onclick="changeDayNum(${weekId}, ${day.id}, -1)" title="День назад">${ICONS.chevronLeft}</button>
                    <span class="date-picker-value">${dateStr}</span>
                    <button onclick="changeDayNum(${weekId}, ${day.id}, 1)" title="День вперёд">${ICONS.chevronRight}</button>
                </div>
                <div class="day-top-btns">
                    <button class="icon-btn" title="Примечания" onclick="toggleNotes(this)">${ICONS.note}</button>
                    <button class="icon-btn" title="Завершить смену" onclick="toggleDayClose(${weekId}, ${day.id})">${ICONS.check}</button>
                    <button class="icon-btn" title="Удалить" onclick="deleteDay(${weekId}, ${day.id})">${ICONS.trash}</button>
                </div>
            </div>

            <div class="shift-row">
                <input type="text" inputmode="decimal" class="hours-input" placeholder="0"
                       value="${day.hours ? formatHours(day.hours) : ''}"
                       oninput="onHoursInput(this, ${weekId}, ${day.id})">
                <span class="hours-word">часов</span>
                <span class="money">${t.money} ₽</span>
            </div>

            <div class="total-row">
                <span class="total-label">Итого за смену:</span>
                <div class="total-block">
                    <span class="total-value">${formatHours(t.hours)} часов</span>
                    <span class="total-money">${t.money} ₽</span>
                </div>
                <button class="${paidBtnClass}" onclick="openPaidDay(${weekId}, ${day.id})">
                    ${paidBtnText}
                </button>
            </div>

            <div class="notes-block ${day.notes ? 'open' : ''}">
                <textarea class="notes-textarea" placeholder="Дополнительные комментарии..."
                          oninput="updateDay(${weekId}, ${day.id}, 'notes', this.value)">${escapeHtml(day.notes)}</textarea>
            </div>
        `;
        return card;
    }

    function onHoursInput(input, weekId, dayId) {
        // Разрешаем только цифры, точку и запятую; одна разделительная
        let val = input.value.replace(/[^0-9.,]/g, '');
        // Заменим запятую на точку для подсчёта
        let normalized = val.replace(',', '.');
        // Уберём лишние точки, оставим только первую
        const firstDot = normalized.indexOf('.');
        if (firstDot !== -1) {
            normalized = normalized.slice(0, firstDot + 1) + normalized.slice(firstDot + 1).replace(/\./g, '');
        }
        // Ограничим до 2 знаков после точки
        if (normalized.includes('.')) {
            const [intPart, fracPart] = normalized.split('.');
            normalized = intPart + '.' + (fracPart || '').slice(0, 2);
        }
        // Ограничим длину целой части
        const finalParts = normalized.split('.');
        if (finalParts[0].length > 4) finalParts[0] = finalParts[0].slice(0, 4);
        normalized = finalParts.join('.');

        // Отображаем обратно с запятой (для удобства пользователя)
        input.value = normalized.replace('.', ',');

        updateDayHours(weekId, dayId, normalized);

        const w = data.weeks.find(x => x.id === weekId);
        if (!w) return;
        const d = w.days.find(x => x.id === dayId);
        if (!d) return;
        const t = getDayTotals(d);

        const card = input.closest('.day-card');
        card.querySelector('.money').textContent = t.money + ' ₽';
        card.querySelector('.total-value').textContent = formatHours(t.hours) + ' часов';
        card.querySelector('.total-money').textContent = t.money + ' ₽';

        const paidBtn = card.querySelector('.paid-btn');
        if (paidBtn && d.paid != null) {
            paidBtn.classList.remove('status-match', 'status-less', 'status-more');
            const status = getPaidStatus(d.paid, t.money);
            if (status === 'match') { paidBtn.classList.add('status-match'); paidBtn.innerHTML = ICONS.check + ' ' + d.paid + ' ₽'; }
            else if (status === 'less') { paidBtn.classList.add('status-less'); paidBtn.innerHTML = '↓ ' + d.paid + ' ₽'; }
            else if (status === 'more') { paidBtn.classList.add('status-more'); paidBtn.innerHTML = '↑ ' + d.paid + ' ₽'; }
        }
    }

    function toggleNotes(btn) {
        const card = btn.closest('.day-card');
        card.querySelector('.notes-block').classList.toggle('open');
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;')
            .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    loadData();
    render();
</script>

</body>
</html>
